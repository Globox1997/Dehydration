plugins {
    id 'net.fabricmc.fabric-loom'
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"

    // Config
    implementation("me.shedaniel.cloth:cloth-config-fabric:${cloth_config_version}") {
        exclude(group: "net.fabricmc.fabric-api")
    }
    // Modmenu
    compileOnly localRuntime("com.terraformersmc:modmenu:${mod_menu_version}") {
        exclude(group: "net.fabricmc.fabric-api")
    }
    // Patchouli
    compileOnly("maven.modrinth:patchouli:${patchouli_version}") {
        exclude(group: "net.fabricmc.fabric-api")
    }
}

sourceSets {
    main {
        java {
            exclude "net/dehydration/compat/DehydrationEmiPlugin.java"
        }
    }
}

loom {
    runs {
        client {
            client()
            setConfigName('Fabric Client')
            ideConfigGenerated(true)
            runDir('../run')
        }
        server {
            server()
            setConfigName('Fabric Server')
            ideConfigGenerated(true)
            runDir('runs/server')
        }
    }
}

processResources {
    def expandProps = [
            'version'             : project.version,
            'minecraft_version'   : minecraft_version,
            'loader_version'      : loader_version,
            'fabric_api_version'  : fabric_api_version,
            'cloth_config_version': cloth_config_version
    ]
    inputs.properties(expandProps)

    filesMatching('fabric.mod.json') {
        expand expandProps
    }
}

def loaderAttribute = Attribute.of('io.github.mcgradleconventions.loader', String)
['apiElements', 'runtimeElements', 'sourcesElements', 'includeInternal', 'modCompileClasspath'].each { variant ->
    configurations.named(variant) {
        attributes {
            attribute(loaderAttribute, 'fabric')
        }
    }
}
sourceSets.configureEach {
    [it.compileClasspathConfigurationName, it.runtimeClasspathConfigurationName].each { variant ->
        configurations.named(variant) {
            attributes {
                attribute(loaderAttribute, 'fabric')
            }
        }
    }
}
